name: Protect UI from auto-updates

on:
  push:
    branches: [main]

jobs:
  protect-ui:
    runs-on: ubuntu-latest
    # Only run if this isn't already a protection commit (prevent infinite loop)
    if: "!contains(github.event.head_commit.message, 'Guard:')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if auto-update modified index.html
        id: check
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          CHANGED="$(git diff HEAD~1 HEAD --name-only | grep '^index.html$' || true)"
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "html_changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "Commit: $COMMIT_MSG"
          echo "index.html changed: $CHANGED"

      - name: Restore index.html if auto-update touched it
        if: contains(steps.check.outputs.commit_msg, 'Auto-update') && steps.check.outputs.html_changed != ''
        run: |
          echo "Auto-update modified index.html — restoring previous version"
          git config user.email "action@github.com"
          git config user.name "GitHub Actions [UI Guard]"
          git checkout HEAD~1 -- index.html
          git add index.html
          git commit -m "Guard: restore index.html after auto-update (only data.json should change)"
          git push
          echo "index.html restored successfully"
