name: Weekly ROVER Scrape

# Weekly full-enrichment digest. Pairs with daily-scrape.yml:
#  - daily handles Tue–Sun list-only scrapes + change-only emails
#  - weekly (this) handles Monday's full-enrichment scrape that also
#    refreshes _sev_category / _propulsion / _approval_holder fields
#    and always sends the digest email (expiring SEVs + ATO headlines).

on:
  schedule:
    # Every Monday at 6:00 AM AEST (Sunday 8:00 PM UTC)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      with_detail:
        description: 'Enrich each record from its ROVER detail page (slow, ~10 min)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      detail_limit:
        description: 'Sample only the first N records when enriching (blank = all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run ROVER scraper
        env:
          REPO_ROOT: ${{ github.workspace }}
          ROVER_DATA_DIR: ${{ github.workspace }}/scripts/data
          O365_TENANT_ID: ${{ secrets.O365_TENANT_ID }}
          O365_CLIENT_ID: ${{ secrets.O365_CLIENT_ID }}
          O365_CLIENT_SECRET: ${{ secrets.O365_CLIENT_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Cron runs always enrich. workflow_dispatch can opt out.
          WITH_DETAIL: ${{ github.event.inputs.with_detail || 'true' }}
          DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '' }}
        run: |
          cd scripts
          ARGS="snapshot --send-email"
          if [ "$WITH_DETAIL" = "true" ]; then
            ARGS="$ARGS --with-detail"
            if [ -n "$DETAIL_LIMIT" ]; then
              ARGS="$ARGS --detail-limit=$DETAIL_LIMIT"
            fi
          fi
          echo "Running: python rover_scraper.py $ARGS"
          python rover_scraper.py $ARGS

      - name: Check for data changes
        id: changes
        run: |
          git diff --quiet data.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions [ROVER Scraper]"
          # data.json is wholly machine-generated — the fresh scrape always wins.
          # Save it aside, fast-forward to origin/main, restore, commit, push.
          # This avoids the rebase/editor conflict trap when daily + weekly runs
          # land close together.
          cp data.json /tmp/data.json.new
          git fetch origin main
          git reset --hard origin/main
          mv /tmp/data.json.new data.json
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json identical to origin/main after refetch — nothing to commit"
            exit 0
          fi
          git commit -m "Auto-update: ROVER data refreshed $(date -u +'%Y-%m-%d')"
          git push
