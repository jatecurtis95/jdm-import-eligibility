name: Weekly ROVER Scrape

# Weekly full-enrichment digest. Pairs with daily-scrape.yml:
#  - daily handles Tue–Sun list-only scrapes + change-only emails
#  - weekly (this) handles Monday's full-enrichment scrape that also
#    refreshes _sev_category / _propulsion / _approval_holder fields
#    and always sends the digest email (expiring SEVs + ATO headlines).

on:
  schedule:
    # Every Monday at 6:00 AM AEST (Sunday 8:00 PM UTC)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      with_detail:
        description: 'Enrich each record from its ROVER detail page (slow, ~10 min)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      detail_limit:
        description: 'Sample only the first N records when enriching (blank = all)'
        required: false
        default: ''
        type: string
      scope_refresh:
        description: 'Force a FULL re-scrape of Vehicle Specification scope (slow; normally incremental)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

# Same group as daily-scrape.yml so the two never push to main concurrently.
concurrency:
  group: rover-scrape
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    # Scope pass runs incrementally (only new approvals), but a big-add week or
    # a forced scope_refresh can take a while — give it real headroom.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run ROVER scraper
        env:
          REPO_ROOT: ${{ github.workspace }}
          ROVER_DATA_DIR: ${{ github.workspace }}/scripts/data
          O365_TENANT_ID: ${{ secrets.O365_TENANT_ID }}
          O365_CLIENT_ID: ${{ secrets.O365_CLIENT_ID }}
          O365_CLIENT_SECRET: ${{ secrets.O365_CLIENT_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Cron runs always enrich. workflow_dispatch can opt out.
          WITH_DETAIL: ${{ github.event.inputs.with_detail || 'true' }}
          DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '' }}
          SCOPE_REFRESH: ${{ github.event.inputs.scope_refresh || 'false' }}
        run: |
          cd scripts
          # Always include the Vehicle Specification (scope) pass on the weekly
          # run — it's incremental, so it only crawls newly-added approvals.
          ARGS="snapshot --send-email --with-scope"
          if [ "$WITH_DETAIL" = "true" ]; then
            ARGS="$ARGS --with-detail"
            if [ -n "$DETAIL_LIMIT" ]; then
              ARGS="$ARGS --detail-limit=$DETAIL_LIMIT"
            fi
          fi
          if [ "$SCOPE_REFRESH" = "true" ]; then
            ARGS="$ARGS --scope-refresh"
          fi
          echo "Running: python rover_scraper.py $ARGS"
          python rover_scraper.py $ARGS

      # See daily-scrape.yml for why these run with !cancelled(): the scraper
      # exits non-zero after a post-write email failure, and we still want the
      # good data committed while the job stays red for the alert.
      - name: Check for data changes
        id: changes
        if: ${{ !cancelled() }}
        run: |
          git diff --quiet functions/_data/data.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: ${{ !cancelled() && steps.changes.outputs.changed == 'true' }}
        uses: ./.github/actions/commit-data
