name: Daily ROVER Scrape

# Daily list-only scrape. Catches new MRE/SEV additions within 24h
# (vs the 7-day lag of weekly-scrape.yml). No detail-page enrichment —
# that's the weekly job's responsibility. Email only fires when there's
# a real addition or removal, so empty days don't spam the inbox.

on:
  schedule:
    # Tue–Sun 6:00 AM AEST (Mon–Sat 20:00 UTC).
    # Skips Sunday UTC (= Monday AEST) to avoid clashing with weekly-scrape.yml.
    - cron: '0 20 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the weekly run (same group) so a daily cron firing mid-weekly
# scrape can't push a competing commit to main. Queued, not cancelled.
concurrency:
  group: rover-scrape
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run ROVER scraper (list-only, gated email)
        env:
          REPO_ROOT: ${{ github.workspace }}
          ROVER_DATA_DIR: ${{ github.workspace }}/scripts/data
          O365_TENANT_ID: ${{ secrets.O365_TENANT_ID }}
          O365_CLIENT_ID: ${{ secrets.O365_CLIENT_ID }}
          O365_CLIENT_SECRET: ${{ secrets.O365_CLIENT_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          cd scripts
          python rover_scraper.py snapshot --send-email --email-only-on-change

      # Runs even if the scraper step failed. The scraper writes data.json BEFORE
      # attempting the (non-fatal-to-data) email, and exits non-zero only after
      # the write on an email failure — so we still want to detect and commit the
      # good data, while the failed step keeps the job red for the alert. A real
      # scrape crash or the publish gate aborts before the write, so data.json is
      # unchanged and nothing gets committed.
      - name: Check for data changes
        id: changes
        if: ${{ !cancelled() }}
        run: |
          git diff --quiet functions/_data/data.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: ${{ !cancelled() && steps.changes.outputs.changed == 'true' }}
        uses: ./.github/actions/commit-data
