name: Daily ROVER Scrape

# Daily list-only scrape. Catches new MRE/SEV additions within 24h
# (vs the 7-day lag of weekly-scrape.yml). No detail-page enrichment —
# that's the weekly job's responsibility. Email only fires when there's
# a real addition or removal, so empty days don't spam the inbox.

on:
  schedule:
    # Tue–Sun 6:00 AM AEST (Mon–Sat 20:00 UTC).
    # Skips Sunday UTC (= Monday AEST) to avoid clashing with weekly-scrape.yml.
    - cron: '0 20 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run ROVER scraper (list-only, gated email)
        env:
          REPO_ROOT: ${{ github.workspace }}
          ROVER_DATA_DIR: ${{ github.workspace }}/scripts/data
          O365_TENANT_ID: ${{ secrets.O365_TENANT_ID }}
          O365_CLIENT_ID: ${{ secrets.O365_CLIENT_ID }}
          O365_CLIENT_SECRET: ${{ secrets.O365_CLIENT_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          cd scripts
          python rover_scraper.py snapshot --send-email --email-only-on-change

      - name: Check for data changes
        id: changes
        run: |
          git diff --quiet functions/_data/data.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions [ROVER Scraper]"
          # data.json is wholly machine-generated — the fresh scrape always wins.
          # Save it aside, fast-forward to origin/main, restore, commit, push.
          # This avoids the rebase/editor conflict trap when daily + weekly runs
          # land close together.
          cp functions/_data/data.json /tmp/data.json.new
          git fetch origin main
          git reset --hard origin/main
          mkdir -p functions/_data
          mv /tmp/data.json.new functions/_data/data.json
          git add functions/_data/data.json
          if git diff --cached --quiet; then
            echo "data.json identical to origin/main after refetch — nothing to commit"
            exit 0
          fi
          git commit -m "Auto-update: ROVER data refreshed $(date -u +'%Y-%m-%d')"
          git push
